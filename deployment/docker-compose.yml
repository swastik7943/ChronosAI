version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-password}

  ai_service:
    build: 
      context: ../ai_service
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - PORT=8000
    depends_on:
      - mongodb

  backend:
    build: 
      context: ../backend
    ports:
      - "5000:5000"
    env_file:
      - ../.env
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-password}@mongodb:27017/chronosai?authSource=admin
      - AI_SERVICE_URL=http://ai_service:8000
    depends_on:
      - mongodb
      - ai_service

  frontend:
    build:
      context: ../frontend
    ports:
      - "5173:5173"
    env_file:
      - ../.env
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongodb_data:
